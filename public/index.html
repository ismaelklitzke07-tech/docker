<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serviço Online</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <div class="icone">⚡</div>

        <p class="status">● SISTEMA ONLINE</p>

        <h1>Bem-vindo!</h1>

        <h2>Seu serviço está online 🚀</h2>

        <p class="descricao">
            Sua aplicação foi publicada com sucesso e está funcionando
            na nuvem através de Docker.
        </p>

        <div class="cards">
            <div class="card">
                <strong>🐳 Docker</strong>
                <span>Container ativo</span>
            </div>

            <div class="card">
                <strong>☁️ Cloud</strong>
                <span>Aplicação publicada</span>
            </div>

            <div class="card">
                <strong>🔒 HTTPS</strong>
                <span>Conexão segura</span>
            </div>
        </div>

        <p class="rodape">
            Desenvolvido com Node.js + Express
        </p>

    </main>

</body>

</html>
